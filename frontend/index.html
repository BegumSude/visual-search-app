<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionBuy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
          <h1>🔍 Görsel Arama Asistanı</h1>
          <p>Bir görsel yükleyin, sizin için benzer ürünleri önerelim!</p>
        </header>
    
        <section class="upload-area">
            <label for="imageInput" class="upload-box">
              <div class="upload-text">📁 Görsel Yükle</div>
              <input type="file" id="imageInput" accept="image/*" hidden />
              <div id="preview" class="preview"></div>
            </label>
            <button id="analyzeBtn">Analiz Et ✨</button>
          </section>
          
    
        <section id="results" class="results">
          
        </section>
      </div>
    
      <script src="script.js"></script>
    
</body>
</html>
